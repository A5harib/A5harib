<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Fredoka;src:url(fonts/Fredoka.ttf);font-weight:300 700}html,body{margin:0;background:#000}</style>
<script src="core.js"></script><script src="icons.js"></script><script src="scenes.js"></script>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
ctx = document.getElementById('c').getContext('2d');
window.setup = async (tl) => { TL = tl; await document.fonts.load('600 40px Fredoka'); await document.fonts.load('700 40px Fredoka'); await document.fonts.load('500 40px Fredoka'); return document.fonts.check('600 40px Fredoka'); };
window.frames = (f0, n, q) => { const out = []; for (let i = 0; i < n; i++) { renderFrame((f0 + i) / TL.fps); out.push(ctx.canvas.toDataURL('image/jpeg', q).slice(23)); } return out; };
</script></body></html>
